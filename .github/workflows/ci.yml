name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-types:
    # Ruff, mypy and the wheel-contents check are platform-independent here,
    # so this job runs once -- unlike `test` below, it does not need a
    # Windows leg.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy --config-file=.code_quality/mypy.ini src

      - name: Build wheel
        run: uv build --wheel

      - name: Verify wheel contains only portfolio_common + metadata
        run: |
          uv run python - <<'PY'
          import pathlib
          import zipfile

          wheel = sorted(pathlib.Path("dist").glob("*.whl"))[-1]
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()

          bad = [
              n
              for n in names
              if not (
                  n.startswith("portfolio_common/")
                  or n.endswith((".dist-info/METADATA", ".dist-info/WHEEL", ".dist-info/RECORD"))
                  or "/licenses/" in n
              )
          ]
          assert not bad, f"wheel contains unexpected paths: {bad}"
          assert any(n.endswith("py.typed") for n in names), "py.typed missing from wheel"
          print(f"OK: {wheel.name} -- {len(names)} entries, all under portfolio_common/ + dist-info")
          PY

  test:
    # The one genuinely platform-sensitive area of this library is path/URI
    # construction (Database.connect_url, _split_url) -- development happens
    # on Windows, so the suite needs to actually run there too, not just on
    # the Linux runner.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync

      - name: Test
        run: uv run pytest -q
