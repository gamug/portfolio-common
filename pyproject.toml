[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-common"
version = "0.3.0"
description = "Shared SQLite connection/schema helpers, the kg_schema analysis-DB contract, the news_nlp results-DB layer, and the S&P 500 universe loader for the Portfolio Thesis repos"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx[http2]>=0.27.0",
    "beautifulsoup4>=4.12",
    "pandas>=2.0",
]

[project.urls]
Repository = "https://github.com/gamug/portfolio-common"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_common"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pre-commit>=4.0",
    "ruff==0.16.3",
    "mypy>=1.13",
]

[tool.uv]
# Consumed as a git dependency by the other Portfolio Thesis repos; this
# project itself is a normal installable package (unlike portfolio-data-mining,
# which sets package = false).
