[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-common"
version = "1.2.0"
description = "The shared database engine (Database + Dialect seam, swappable in one place), injection-safe query-building primitives (in_clause, Allowlist), and the shared news_export read contract, across the Portfolio Thesis repos"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.urls]
Repository = "https://github.com/gamug/portfolio-common"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_common"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pre-commit>=4.0",
    "ruff==0.16.3",
    "mypy>=1.13",
]

[tool.uv]
# Consumed as a git dependency by the other Portfolio Thesis repos; this
# project itself is a normal installable package (unlike portfolio-data-mining,
# which sets package = false).
